[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bio-battle"
version = "0.1.0"
description = "Generate printable PDF trading cards from Wikipedia biographies"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL"}
authors = [
    {name = "dddjjjbbb"}
]
dependencies = [
    "requests>=2.28.0",
    "pillow>=9.0.0",
    "reportlab>=4.0.0",
    "beautifulsoup4>=4.11.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "click>=8.0.0",
    "returns>=0.22.0",
    "qrcode[pil]>=7.0.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "pytest-mock>=3.10.0",
    "responses>=0.22.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
    "types-requests>=2.28.0",
    "types-beautifulsoup4>=4.11.0",
]

[project.scripts]
bio-battle = "bio_battle.main:cli"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_ut.py", "*_it.py"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[[tool.mypy.overrides]]
module = ["reportlab.*", "PIL.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src/bio_battle"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]
